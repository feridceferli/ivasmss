name: Persistent rental and top-up tests

on:
  push:
    paths:
      - main.py
      - rental_ledger.py
      - topup_ledger.py
      - topup_web.py
      - docs/app.js
      - docs/index.html
      - service_policy.py
      - test_rental_ledger.py
      - test_topup_ledger.py
      - test_topup_web.py
      - test_service_policy.py
      - .github/workflows/persistent-rentals-tests.yml
  pull_request:
    paths:
      - main.py
      - rental_ledger.py
      - topup_ledger.py
      - topup_web.py
      - docs/app.js
      - docs/index.html
      - service_policy.py
      - test_rental_ledger.py
      - test_topup_ledger.py
      - test_topup_web.py
      - test_service_policy.py
      - .github/workflows/persistent-rentals-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rental-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bot and module syntax
        run: python -m py_compile main.py rental_ledger.py topup_ledger.py topup_web.py service_policy.py
      - name: Check Mini App JavaScript syntax
        run: node --check docs/app.js
      - name: Verify idempotent settlement and persistence
        run: python -m unittest -v test_rental_ledger test_topup_ledger test_topup_web test_service_policy test_active_leases_persistence
