name: Ivasper admin tests
on:
  push:
    paths:
      - ivasper_admin.py
      - ivasper_web.py
      - ivasper_external.py
      - main.py
      - docs/app.js
      - docs/index.html
      - test_ivasper_admin.py
      - test_ivasper_web.py
      - test_ivasper_web_ui.cjs
  pull_request:
    paths:
      - ivasper_admin.py
      - ivasper_web.py
      - ivasper_external.py
      - main.py
      - docs/app.js
      - docs/index.html
      - test_ivasper_admin.py
      - test_ivasper_web.py
      - test_ivasper_web_ui.cjs
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "python-telegram-bot==22.8"
      - run: python -m unittest -v test_ivasper_admin.py test_ivasper_web.py
      - run: node --check docs/app.js && node test_ivasper_web_ui.cjs
