<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IvaSMS Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>🛡️ IvaSMS Panel</h2>
            <p id="user-greeting">Yüklənir...</p>
        </header>

        <!-- Referans Seksiyası -->
        <div class="card" id="ref-card">
            <h3>👥 Dəvət Sistemi</h3>
            <p id="status-text">Yoxlanılır...</p>
            <div class="ref-box" id="ref-box" style="display: none;">
                <p>Sənin dəvət linkin:</p>
                <input type="text" id="ref-link-input" readonly>
                <button id="copy-btn">🔗 Linki Kopyala</button>
            </div>
        </div>

        <!-- OTP Mesajları Seksiyası -->
        <div class="card" id="content-card" style="display: none;">
            <h3>📥 Gələn OTP və SMS-lər</h3>
            <div id="messages-list">
                <p class="empty">Hələ ki mesaj yoxdur.</p>
            </div>
        </div>

        <!-- Kilid Banneri -->
        <div class="locked-banner" id="locked-banner">
            <p>❌ Botun funksiyalarından istifadə etmək üçün <b>ən azı 1 dostunu</b> dəvət etməlisən!</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
