name: Safe broadcast tests
on:
  push:
    branches: [main]
    paths: ["safe_broadcast.py", "test_safe_broadcast.py", "main.py", ".github/workflows/safe-broadcast-tests.yml"]
  pull_request:
    paths: ["safe_broadcast.py", "test_safe_broadcast.py", "main.py", ".github/workflows/safe-broadcast-tests.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "python-telegram-bot[webhooks]==22.8"
      - run: python -m py_compile main.py safe_broadcast.py
      - run: python -m unittest -v test_safe_broadcast
