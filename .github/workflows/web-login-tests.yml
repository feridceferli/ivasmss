name: Website + Telegram account linking

on:
  push:
    paths:
      - main.py
      - web_login.py
      - test_web_login.py
      - docs/web-login.js
      - docs/web-login.css
      - docs/app.js
      - docs/index.html
      - .github/workflows/web-login-tests.yml
  pull_request:
    paths:
      - main.py
      - web_login.py
      - test_web_login.py
      - docs/web-login.js
      - docs/web-login.css
      - docs/app.js
      - docs/index.html
      - .github/workflows/web-login-tests.yml
  workflow_dispatch:

jobs:
  website-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile main.py web_login.py
      - name: JavaScript syntax
        run: node --check docs/app.js && node --check docs/web-login.js
      - name: Telegram account linking tests
        run: python -m unittest -v test_web_login
