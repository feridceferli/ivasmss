<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aze SMS Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>// Servis seçildiğinde doğrudan Mini App üzerinden numara alır
async function selectService(serviceName) {
    tg.HapticFeedback.impactOccurred('medium');
    
    // Kullanıcıya yükleniyor bildirimi gösterelim
    const container = document.getElementById('active-orders-container');
    container.innerHTML = `<p class="hint">📡 ${serviceName.toUpperCase()} için numara aranıyor...</p>`;
    switchTab('active');

    try {
        const res = await fetch(`${API_BASE}/api/get-number`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ service: serviceName })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            alert(data.message || "Numara alınamadı!");
            fetchOrders();
            return;
        }

        // Başarılı olursa kullanıcıya numara alındığını bildir ve aktifler sekmesini yenile
        tg.showAlert(`Numara başarıyla alındı!\n\nNumara: ${data.number}`);
        fetchOrders();
        fetchDashboard();
        
    } catch (e) {
        console.error("Numara alma xətası:", e);
        alert("Bağlantı hatası oluştu.");
        fetchOrders();
    }
}</script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Profil Başlığı */
        .profile-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--button-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .balance-box {
            text-align: right;
        }
        .balance-amount {
            font-size: 18px;
            font-weight: bold;
            color: var(--success);
        }

        /* Tab Menyu */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: 10px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--hint-color);
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Xidmət Şəbəkəsi (Grid) */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .service-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .service-card:active {
            background: rgba(255,255,255,0.1);
        }

        /* SMS Kartları */
        .sms-item {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--button-color);
        }
        .otp-code {
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 15px;
            color: #facc15;
            letter-spacing: 0.5px;
            user-select: all;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
        }
        
        .hint {
            color: var(--hint-color);
            font-size: 13px;
            text-align: center;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profil və Bakiye Kartı -->
        <div class="card profile-card">
            <div class="user-info">
                <div class="avatar" id="user-avatar">?</div>
                <div>
                    <h4 id="user-name" style="margin: 0 0 2px 0;">Yüklənir...</h4>
                    <span id="user-id" style="color: var(--hint-color); font-size: 12px;">ID: --</span>
                </div>
            </div>
            <div class="balance-box">
                <div style="font-size: 11px; color: var(--hint-color);">BALANS</div>
                <div class="balance-amount" id="user-balance">0.00 AZN</div>
            </div>
        </div>

        <!-- Naviqasiya Tabları -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('services')">📡 Xidmətlər</button>
            <button class="tab-btn" onclick="switchTab('active')">📱 Aktivlər</button>
            <button class="tab-btn" onclick="switchTab('history')">📜 Tarixçə</button>
        </div>

        <!-- 1. Xidmətlər Tabı -->
        <div id="tab-services" class="tab-content active">
            <div class="card">
                <h4 style="margin: 0 0 10px 0;">🌍 Mövcud Xidmətlər və Ölkələr</h4>
                <div class="services-grid" id="services-grid-container">
                    <p class="hint">Xidmətlər yüklənir...</p>
                </div>
            </div>
        </div>

        <!-- 2. Aktiv Nömrələr Tabı -->
        <div id="tab-active" class="tab-content">
            <div class="card">
                <h4 style="margin: 0 0 10px 0;">📱 Aktiv Sifarişlər</h4>
                <div id="active-orders-container">
                    <p class="hint">Aktiv nömrə yoxdur.</p>
                </div>
            </div>
        </div>

        <!-- 3. Tarixçə və Gələn SMS-lər Tabı -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <h4 style="margin: 0 0 10px 0;">📥 Gələn OTP və SMS Tarixçəsi</h4>
                <div id="sms-list-container">
                    <p class="hint">Hələ ki gələn mesaj yoxdur...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
