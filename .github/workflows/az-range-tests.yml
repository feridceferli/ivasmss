name: Azerbaijan range access tests

on:
  push:
    paths:
      - main.py
      - test_az_permissions.py
      - .github/workflows/az-range-tests.yml
  pull_request:
    paths:
      - main.py
      - test_az_permissions.py
      - .github/workflows/az-range-tests.yml
  workflow_dispatch:

jobs:
  az-range-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bot Python syntax
        run: python -m py_compile main.py
      - name: Check operator catalog and admin permissions
        run: python -m unittest -v test_az_permissions
