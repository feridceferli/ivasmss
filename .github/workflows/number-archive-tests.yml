name: Private archive regression tests
on:
  push:
    paths:
      - "number_archive.py"
      - "test_number_archive.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/number-archive-tests.yml"
  pull_request:
    paths:
      - "number_archive.py"
      - "test_number_archive.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/number-archive-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile number_archive.py main.py test_number_archive.py
      - run: python -m unittest -v test_number_archive
