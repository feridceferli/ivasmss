name: Marketplace and manual top-up tests
on:
  push:
    paths:
      - "main.py"
      - "marketplace.py"
      - "manual_topups.py"
      - "market_bot_ui.py"
      - "test_marketplace.py"
      - "test_number_choice_integration.py"
  pull_request:
    paths:
      - "main.py"
      - "marketplace.py"
      - "manual_topups.py"
      - "market_bot_ui.py"
      - "test_marketplace.py"
      - "test_number_choice_integration.py"
jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py marketplace.py manual_topups.py market_bot_ui.py test_marketplace.py test_number_choice_integration.py
      - run: python -m unittest -v test_marketplace test_number_choice_integration test_active_leases_persistence
