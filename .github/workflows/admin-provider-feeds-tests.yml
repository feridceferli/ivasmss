name: Private SMS provider integration tests

on:
  push:
    paths:
      - admin_provider_feeds.py
      - main.py
      - docs/admin-provider-feeds.js
      - docs/index.html
      - docs/app.js
      - test_admin_provider_feeds.py
      - .github/workflows/admin-provider-feeds-tests.yml
  pull_request:
    paths:
      - admin_provider_feeds.py
      - main.py
      - docs/admin-provider-feeds.js
      - docs/index.html
      - docs/app.js
      - test_admin_provider_feeds.py
      - .github/workflows/admin-provider-feeds-tests.yml
  workflow_dispatch:

jobs:
  private-provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install HTTP dependencies for offline tests
        run: python -m pip install "httpx==0.28.1" "aiohttp==3.11.16"
      - name: Check Python syntax
        run: python -m py_compile main.py admin_provider_feeds.py test_admin_provider_feeds.py
      - name: Check browser syntax
        run: node --check docs/admin-provider-feeds.js && node --check docs/app.js
      - name: Run offline provider and access-control tests
        run: python -m unittest -v test_admin_provider_feeds
