name: World country-code directory tests

on:
  push:
    paths:
      - main.py
      - world_country_codes.py
      - test_world_country_codes.py
      - .github/workflows/world-country-tests.yml
  pull_request:
    paths:
      - main.py
      - world_country_codes.py
      - test_world_country_codes.py
      - .github/workflows/world-country-tests.yml
  workflow_dispatch:

jobs:
  world-calling-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile main.py world_country_codes.py
      - name: Test all-country range and country-code lookup
        run: python -m unittest -v test_world_country_codes
