<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IvaSMS Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="status-badge" id="online-badge">● Sistem Aktivdir</div>
            <h2>🛡️ IvaSMS Panel</h2>
            <p id="user-greeting">İstifadəçi təyin olunur...</p>
        </header>

        <!-- Referans Kütləsi -->
        <div class="card" id="ref-card">
            <h3>👥 Dəvət Vəziyyəti</h3>
            <div id="status-indicator" class="status-box">Yoxlanılır...</div>
            <div class="ref-box" id="ref-box" style="display: none;">
                <label>Sizin Dəvət Linkiniz:</label>
                <div class="input-group">
                    <input type="text" id="ref-link-input" readonly>
                    <button id="copy-btn">📋 Kopyala</button>
                </div>
            </div>
        </div>

        <!-- Məzmun Kütləsi -->
        <div class="card" id="content-card" style="display: none;">
            <div class="card-header">
                <h3>📥 Gələn OTP və SMS-lər</h3>
                <button id="refresh-btn" class="refresh-btn">🔄 Yenilə</button>
            </div>
            <div id="messages-list">
                <p class="empty">Hələ ki mesaj yoxdur.</p>
            </div>
        </div>

        <!-- Kilid Ekranı -->
        <div class="locked-banner" id="locked-banner">
            <div class="lock-icon">🔒</div>
            <p>Panelin kilidini açmaq üçün <b>ən azı 1 dostunuzu</b> dəvət etməlisiniz.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
