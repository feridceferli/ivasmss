<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aze SMS Panel - Mini App</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Stil Dosyası -->
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18222d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8796a5);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.05);
            --success-color: #2ea6ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-box {
            font-size: 20px;
            font-weight: bold;
            color: var(--success-color);
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .sms-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--button-color);
        }

        .sms-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 6px;
        }

        .otp-code {
            background: #2b3947;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 16px;
            color: #ffeb3b;
            letter-spacing: 1px;
        }

        code {
            background: rgba(0,0,0,0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profil ve Bakiye Kartı -->
        <div class="card profile-header">
            <div>
                <h3 id="user-name" style="margin: 0 0 4px 0;">Yükleniyor...</h3>
                <span id="user-id" style="color: var(--hint-color); font-size: 13px;">ID: --</span>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 12px; color: var(--hint-color);">Bakiye</div>
                <div class="balance-box" id="user-balance">0.00 AZN</div>
            </div>
        </div>

        <!-- Hızlı İşlemler Kartı -->
        <div class="card">
            <h4 style="margin-top: 0; margin-bottom: 12px;">⚡ Hızlı İşlemler</h4>
            <button class="btn" onclick="openBotGetNumber()">📞 Numara Al / Servisler</button>
        </div>

        <!-- Aktif Siparişler / Numaralar -->
        <div class="card">
            <h4 style="margin-top: 0; margin-bottom: 12px;">📱 Aktif Numaralar</h4>
            <div id="active-orders-container">
                <p style="color: var(--hint-color); text-align: center; margin: 10px 0;">Aktif numara bulunmuyor.</p>
            </div>
        </div>

        <!-- Gelen SMS ve OTP Kodları -->
        <div class="card">
            <h4 style="margin-top: 0; margin-bottom: 12px;">📥 Gelen SMS / OTP Listesi</h4>
            <div id="sms-list-container">
                <p style="color: var(--hint-color); text-align: center; margin: 10px 0;">Henüz gelen mesaj yok...</p>
            </div>
        </div>
    </div>

    <!-- JavaScript Kod Bağlantısı -->
    <script src="app.js"></script>
</body>
</html>
