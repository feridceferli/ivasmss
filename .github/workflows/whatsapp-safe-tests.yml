name: WhatsApp safe integration tests
on:
  push:
    paths:
      - 'whatsapp_safe.py'
      - 'admin_test_tools.py'
      - 'integrate_into_ivasmss.py'
      - 'main.py'
      - 'tests/test_whatsapp_safe.py'
      - 'tests/test_admin_test_tools.py'
      - 'tests/test_integrate.py'
      - '.github/workflows/whatsapp-safe-tests.yml'
  pull_request:
    paths:
      - 'whatsapp_safe.py'
      - 'admin_test_tools.py'
      - 'integrate_into_ivasmss.py'
      - 'main.py'
      - 'tests/test_whatsapp_safe.py'
      - 'tests/test_admin_test_tools.py'
      - 'tests/test_integrate.py'
      - '.github/workflows/whatsapp-safe-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile main.py whatsapp_safe.py admin_test_tools.py integrate_into_ivasmss.py
