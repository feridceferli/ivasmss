name: Safe SMS diagnostics tests

on:
  push:
    paths:
      - "sms_test_diagnostics.py"
      - "test_sms_test_diagnostics.py"
      - "main.py"
      - "user_backup.py"
      - "docs/sms-test-diagnostics.js"
      - "docs/index.html"
      - "docs/app.js"
      - ".github/workflows/sms-diagnostics-tests.yml"
  pull_request:
    paths:
      - "sms_test_diagnostics.py"
      - "test_sms_test_diagnostics.py"
      - "main.py"
      - "user_backup.py"
      - "docs/sms-test-diagnostics.js"
      - "docs/index.html"
      - "docs/app.js"
      - ".github/workflows/sms-diagnostics-tests.yml"

jobs:
  sms-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile sms_test_diagnostics.py main.py user_backup.py
      - name: Test diagnostics, history, permission and consent
        run: python -m unittest -v test_sms_test_diagnostics
      - name: Check JavaScript syntax
        run: node --check docs/sms-test-diagnostics.js && node --check docs/app.js
