name: Mini App parity and security tests

on:
  push:
    paths:
      - main.py
      - number_choices.py
      - test_number_choices.py
      - test_number_choice_integration.py
      - otp_leaderboard.py
      - test_otp_leaderboard.py
      - free_ai_posts.py
      - test_free_ai_posts.py
      - global_availability_feed.py
      - world_news_feed.py
      - user_backup.py
      - test_user_backup.py
      - test_world_news_feed.py
      - docs/index.html
      - docs/app.js
      - docs/website-desktop.css
      - docs/website-desktop.js
      - test_website_desktop.cjs
      - docs/web-login.js
      - docs/web-login.css
      - web_login.py
      - test_web_login.py
      - docs/miniapp-modern.css
      - test_miniapp_parity.py
      - test_miniapp_active_numbers.py
      - test_telegram_profile_photo.py
      - test_telegram_avatar_ui.cjs
      - test_miniapp_admin_tools.py
      - test_miniapp_withdrawals.py
      - test_miniapp_service_picker.cjs
      - test_miniapp_newest_copy.cjs
      - test_az_provider_diagnostics.cjs
      - test_world_provider_diagnostics.cjs
      - docs/world-provider-diagnostics.js
      - test_world_provider_diagnostics.cjs
      - docs/world-provider-diagnostics.js
      - docs/az-provider-diagnostics.js
      - world_country_codes.py
      - number_pricing.py
      - test_number_pricing.py
      - .github/workflows/miniapp-parity-tests.yml
  pull_request:
    paths:
      - main.py
      - number_choices.py
      - test_number_choices.py
      - test_number_choice_integration.py
      - otp_leaderboard.py
      - test_otp_leaderboard.py
      - free_ai_posts.py
      - test_free_ai_posts.py
      - global_availability_feed.py
      - world_news_feed.py
      - user_backup.py
      - test_user_backup.py
      - test_world_news_feed.py
      - docs/index.html
      - docs/app.js
      - docs/website-desktop.css
      - docs/website-desktop.js
      - test_website_desktop.cjs
      - docs/web-login.js
      - docs/web-login.css
      - web_login.py
      - test_web_login.py
      - docs/miniapp-modern.css
      - test_miniapp_parity.py
      - test_miniapp_active_numbers.py
      - test_telegram_profile_photo.py
      - test_telegram_avatar_ui.cjs
      - test_miniapp_admin_tools.py
      - test_miniapp_withdrawals.py
      - test_miniapp_service_picker.cjs
      - test_miniapp_newest_copy.cjs
      - test_az_provider_diagnostics.cjs
      - test_world_provider_diagnostics.cjs
      - docs/world-provider-diagnostics.js
      - test_world_provider_diagnostics.cjs
      - docs/world-provider-diagnostics.js
      - docs/az-provider-diagnostics.js
      - world_country_codes.py
      - number_pricing.py
      - test_number_pricing.py
      - .github/workflows/miniapp-parity-tests.yml
  workflow_dispatch:

jobs:
  miniapp-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install AI HTTP client for offline tests
        run: python -m pip install httpx==0.28.1
      - name: Confirm modern CSS stylesheet exists
        run: test -s docs/miniapp-modern.css
      - name: Check JavaScript syntax
        run: node --check docs/app.js && node --check docs/website-desktop.js && node --check docs/web-login.js && node --check docs/az-provider-diagnostics.js && node --check docs/world-provider-diagnostics.js && node --check docs/world-provider-diagnostics.js
      - name: Test read-only Azerbaijan range diagnostics
        run: node test_az_provider_diagnostics.cjs
      - name: Test worldwide owner-scoped range and active-number diagnostics
        run: node test_world_provider_diagnostics.cjs
      - name: Test all-country range and own active-number diagnostics
        run: node test_world_provider_diagnostics.cjs
      - name: Test service country picker and +994 price display
        run: node test_miniapp_service_picker.cjs
      - name: Test website-only desktop and mobile navigation
        run: node test_website_desktop.cjs
      - name: Test latest number ordering and automatic copy
        run: node test_miniapp_newest_copy.cjs
      - name: Test Telegram Mini App avatar privacy and fallback
        run: node test_telegram_avatar_ui.cjs
      - name: Check Python syntax
        run: python -m py_compile main.py number_choices.py web_login.py otp_leaderboard.py world_country_codes.py number_pricing.py free_ai_posts.py global_availability_feed.py world_news_feed.py user_backup.py
      - name: Test Mini App parity, safe rendering and +994 permissions
        run: python -m unittest -v test_number_choices test_number_choice_integration test_otp_leaderboard test_web_login test_miniapp_parity test_miniapp_active_numbers test_miniapp_admin_tools test_miniapp_withdrawals test_world_country_codes test_az_permissions test_telegram_profile_photo test_number_pricing test_free_ai_posts test_global_availability_feed test_world_news_feed test_user_backup
